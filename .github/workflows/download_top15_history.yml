name: Download historical TOP15 GPW prices
on:
  push:
    branches: [research/top15-historical-data]
    paths:
      - scripts/download_top15_history.py
      - scripts/backtest_top15_pit.py
      - .github/workflows/download_top15_history.yml
  workflow_dispatch:
concurrency:
  group: historical-top15-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download historical prices and record errors
        run: python scripts/download_top15_history.py
      - name: Run historical three-strategy backtest
        run: python scripts/backtest_top15_pit.py
      - name: Publish CSV, coverage and backtest reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top15/ backtest/top15/
          if ! git diff --cached --quiet; then
            git commit -m "Publish TOP15 historical OHLCV and coverage"
            git pull --rebase origin research/top15-historical-data
            git push origin HEAD:research/top15-historical-data
          fi
