name: Test Stooq without API key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test CSV response (no credentials)
        shell: python
        run: |
          import urllib.request, urllib.error
          for host in ("https://stooq.com","https://stooq.pl"):
              url=f"{host}/q/d/l/?s=abs&i=d"
              print("Testing",url)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      data=resp.read(400).decode("utf-8",errors="replace")
                      print("HTTP",resp.status,"CSV header:",repr(data.splitlines()[0] if data else ""))
                      if data.startswith("Date,Open,High,Low,Close,Volume"):
                          print("VALID CSV")
                      else:
                          print("NOT CSV (key/captcha/block or error)")
              except urllib.error.HTTPError as e:
                  print("HTTP",e.code,"NOT CSV")
              except Exception as e:
                  print(type(e).__name__,str(e)[:250])
