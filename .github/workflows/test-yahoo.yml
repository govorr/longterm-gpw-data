name: Test Yahoo GPW OHLCV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify GPW daily price candles
        shell: python
        run: |
          import urllib.request,urllib.error,json,datetime
          for symbol in ["ASB.WA","CRI.WA","ELT.WA","SEV.WA"]:
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range=1y&interval=1d"
              print("\\nSYMBOL",symbol,flush=True)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      doc=json.load(response)
                  result=doc["chart"]["result"][0]
                  quote=result["indicators"]["quote"][0]
                  good=[i for i,x in enumerate(quote["close"]) if x is not None and quote["open"][i] is not None and quote["high"][i] is not None and quote["low"][i] is not None and quote["volume"][i] is not None]
                  if good:
                      i=good[-1]
                      date=datetime.datetime.fromtimestamp(result["timestamp"][i],datetime.timezone.utc).date()
                      print("OK", "currency",result["meta"].get("currency"),"bars",len(good),"latest",date,"close",quote["close"][i])
                  else:
                      print("FAIL no complete OHLCV candles")
              except urllib.error.HTTPError as e:
                  print("FAIL HTTP",e.code)
              except Exception as e:
                  print("FAIL",type(e).__name__,str(e)[:200])
