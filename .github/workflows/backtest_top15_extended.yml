name: Extended TOP15 backtest vs WIG
on:
  push:
    branches: [research/top15-long-horizon]
    paths:
      - scripts/backtest_top15_extended.py
      - .github/workflows/backtest_top15_extended.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extended TOP15 backtest
        run: python scripts/backtest_top15_extended.py
      - name: Commit research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest_top15_extended.json
          git diff --cached --quiet || (git commit -m "Publish extended TOP15 comparison" && git push)
