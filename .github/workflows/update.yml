name: Yahoo GPW daily update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 1-5'
      timezone: 'Europe/Warsaw'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and calculate
        run: python scripts/update.py
      - name: Publish verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet || (git commit -m "Update daily GPW snapshot" && git push)
