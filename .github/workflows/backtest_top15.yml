name: Research TOP15 TP backtest
on:
  push:
    branches: [research/top15-tp-backtest]
    paths:
      - scripts/backtest_top15.py
      - .github/workflows/backtest_top15.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download historical data and compare strategies
        run: python scripts/backtest_top15.py
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest_top15_v2.json
          git diff --cached --quiet || (git commit -m "Update TOP15 research backtest results" && git push)
